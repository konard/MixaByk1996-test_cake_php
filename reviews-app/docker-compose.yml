version: '3.8'

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: reviews_db
      MYSQL_USER: reviews_user
      MYSQL_PASSWORD: reviews_pass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "reviews_user", "-previews_pass"]
      interval: 5s
      timeout: 10s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: ReviewsApp
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: reviews_db
      DB_USERNAME: reviews_user
      DB_PASSWORD: reviews_pass
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      FRONTEND_URL: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_storage:/var/www/storage

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./backend/public:/var/www/public
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:80"
    depends_on:
      - nginx

volumes:
  db_data:
  backend_storage:
